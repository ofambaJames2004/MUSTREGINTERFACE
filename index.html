<!DOCTYPE html>
<html lang = "en">
<head>
	<meta charset = "UTF-8">
	<meta name = "viewport" content = "width= device-width, initial-scale= 1.0">
	<title> MUST Online Application Portal - Login</title>

	<!-- Connect this page to the shared CSS file-->
	<link rel = "stylesheet" href = "style.css">
</head>
<>
	<main class = "portal">
		<div class = "university-logo">
			<img src= "D:\Desktop\MUST LOGO.png" alt = "Mbarara University of Science and Technology Logo" class = "must-logo">
		</div>
		<h1> MBARARA UNIVERSITY OF SCIENCE AND TECHNOLOGY</h1>
		<p class = "portal-label"> Online Application Portal</p>

		<!-- Login interface-->
		<section class = "card">
			<h2> Welcome Back</h2>
			<p class = "subtitle">
			Log in to access your application dashboard</p>
			<form action = "#" method = "post">
				<label for = "email"> Email Address</label>
				<input type = "email" id = "email" name = "email" placeholder = "name@example.com" autocomplete = "email" required>

				<label for = "password"> Password</label>
				<input type = "password" id = "password" name = "password" placeholder = "Enter your password" autocomplete = "current-password" required>
				<button type = "submit" class = "primary-button"> Sign In</button>
				</form>
				<p class = "link-row">
				<a href = "#" class = "text-link" > Forgot your password?</a>
				</p>
				<p class = "subtitle new-user"> New to the portal?</p>

				<!-- Opens the separate registration HTML file-->
				<a href = "register.html" class = "outline-button"> Create Account</a>
				<p class = "link-row">
				<a href = "#" class = "text-link"> How To Apply?</a>
				</p>
				</section>
				<footer>
				<p> Student Application Portal</p>
				</footer>
				</main>
				<!-- Put javascript code in here-->
				<script src = "app.js"></script>
				</body>
				</html>
